# SPDX-License-Identifier: Apache-2.0
[package]
name = "susi-tools"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "The development programs of the Susi AI OS ecosystem, over plain Git: the Board, tasks and claims, shipping, the Git hooks' rules and the harvest audit."
publish = false

# No dependencies on purpose: Susi Tools stands alone (decided 2026-11-22), builds offline from
# the standard library, and talks to repositories only through the `git` program.
[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
